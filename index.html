<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourHours – Erklärvideo</title>
<style>
  body { margin: 0; background: #F2F4F7; color: #1F2933; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background: linear-gradient(#22436B, #132A45); color: #fff; padding: 28px 16px 22px; text-align: center; }
  h1 { margin: 0; font-size: 28px; }
  header p { margin: 6px 0 0; color: #C9D3E0; }
  .langs { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
  .langs button { font: inherit; font-size: 15px; font-weight: 700; padding: 8px 18px; border-radius: 999px; border: 1px solid #5C7799; background: transparent; color: #DDE5EF; cursor: pointer; }
  .langs button.on { background: #fff; color: #1E3A5F; border-color: #fff; }
  .langs button[hidden] { display: none; }
  main { max-width: 440px; margin: 0 auto; padding: 20px 16px 40px; }
  video { width: 100%; border-radius: 18px; background: #132A45; box-shadow: 0 6px 24px rgba(19, 42, 69, .25); }
  p { line-height: 1.5; }
  .small { color: #5B6773; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>YourHours</h1>
  <p id="tag"></p>
  <div class="langs">
    <button data-l="de">Deutsch</button>
    <button data-l="en">English</button>
    <button data-l="pcm" hidden>Pidgin</button>
  </div>
</header>
<main>
  <video id="v" controls playsinline preload="metadata"></video>
  <p id="p1"></p>
  <p class="small" id="p2"></p>
</main>
<script>
  // Eine Seite für alle Sprachen: ?lang=de|en|pcm (Pidgin nur über den Link aus der App sichtbar)
  var T = {
    de: { video: 'YourHours-Erklaervideo.mp4', title: 'YourHours – Erklärvideo', tag: 'Deine Stunden. Dein Nachweis.',
      p1: 'Ein Tipp bei Dienstbeginn, einer bei Feierabend. YourHours rechnet Pausen, Soll und Überstunden aus und erstellt deinen Nachweis als PDF oder Excel.',
      p2: 'Alle Daten bleiben auf deinem Handy – kein Konto, kein Server. Hilfe in der App jederzeit über das „?“ oben rechts.' },
    en: { video: 'YourHours-Explainer-en.mp4', title: 'YourHours – Explainer video', tag: 'Your hours. Your proof.',
      p1: 'One tap when you start, one when you finish. YourHours works out breaks, target hours and overtime, and creates your record as a PDF or Excel file.',
      p2: 'All data stays on your phone – no account, no server. Help in the app at any time via the “?” at the top right.' },
    pcm: { video: 'YourHours-Explainer-pcm.mp4', title: 'YourHours – Video', tag: 'Your hours. Your proof.',
      p1: 'One touch when you start work, one when you close. YourHours di count break, work time and overtime, and e di make your proof as PDF or Excel.',
      p2: 'All your data dey only for your phone – no account, no server. For help inside di app, touch di “?” for up, right side.' }
  };
  var q = new URLSearchParams(location.search).get('lang');
  var pcm = q === 'pcm';
  try { pcm = pcm || localStorage.getItem('yh.pcm') === '1'; if (pcm) localStorage.setItem('yh.pcm', '1'); } catch (e) {}
  if (pcm) document.querySelector('[data-l="pcm"]').hidden = false;

  function show(l) {
    var t = T[l], v = document.getElementById('v');
    document.documentElement.lang = l === 'de' ? 'de' : 'en';
    document.title = t.title;
    document.getElementById('tag').textContent = t.tag;
    document.getElementById('p1').textContent = t.p1;
    document.getElementById('p2').textContent = t.p2;
    v.pause();
    v.poster = 'poster-' + l + '.jpg';
    v.src = t.video;
    v.load();
    document.querySelectorAll('.langs button').forEach(function (b) { b.classList.toggle('on', b.dataset.l === l); });
    history.replaceState(null, '', '?lang=' + l);
  }
  document.querySelectorAll('.langs button').forEach(function (b) { b.onclick = function () { show(b.dataset.l); }; });
  show(T[q] ? q : /^de/i.test(navigator.language || '') ? 'de' : 'en');
</script>
</body>
</html>
